<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌻 دوار شمس يتفتح من الكود</title>
    <meta name="description" content="قلب واحد من الكود يتحول إلى دوار شمس ثلاثي الأبعاد جميل يتفتح.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=Inter:wght@500;700&family=Fira+Code:wght@500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="vignette"></div>


    <div class="spotlight"></div>
    <div class="ambient-light" id="ambientLight"></div>

    <div class="trigger-overlay" id="triggerOverlay">
        <div class="glass-card">
            <div class="card-glow"></div>
            <div class="rose-icon">🌻</div>
            <h2 class="title">Love.css</h2>
            <div class="loading-bar-container">
                <div class="loading-bar" id="loadingBar"></div>
            </div>
            <p class="status-text" id="statusText">جاهز للترجمة البرمجية...</p>
            <button class="start-button" id="startButton" disabled>
                <span class="btn-text">اضغط لتتفتح</span>
                <span class="btn-shine"></span>
            </button>
        </div>
    </div>

    <div class="scene">
        <div class="rose-wrapper" id="roseWrapper">
            <div class="stem-group">
                <div class="stem" id="stem">
                    <div class="stem-highlight"></div>
                </div>
                <div class="thorn thorn-1" id="thorn1"></div>
                <div class="thorn thorn-2" id="thorn2"></div>
                <div class="leaf leaf-left" id="leafLeft">
                    <div class="leaf-vein"></div>
                </div>
                <div class="leaf leaf-right" id="leafRight">
                    <div class="leaf-vein"></div>
                </div>
            </div>

            <div class="calyx" id="calyx"></div>

            <div class="rose-head" id="roseHead">
                <div class="rose-glow"></div>
                <div class="rose-glow-inner"></div>
                <div class="flower-disc"></div>
            </div>
        </div>
    </div>

    <div class="end-text" id="endText">
        <p class="tagline" id="tagline">كتب الكود هذا لك</p>
        <p class="subtext">أنا دايماً بكون معاك يا بيب 💛</p>
    </div>

    <div class="lyrics-panel" id="lyricsPanel" dir="ltr">
        <div class="lyrics-title">Just the Two of Us</div>
        <div class="lyrics-lines">
            <div class="lyrics-line prev" id="lyricsPrev"></div>
            <div class="lyrics-line current" id="lyricsCurrent"></div>
            <div class="lyrics-line next" id="lyricsNext"></div>
        </div>
    </div>

    <audio id="bgMusic" src="Song.mp3" loop preload="metadata"></audio>

    <div id="fallingPetals"></div>

    <script src="script.js"></script>
</body>

</html>
